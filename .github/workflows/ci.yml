# Feblio · CI mínima del frontend.
# Solo comprobaciones estáticas y tests unitarios: sin secretos, sin despliegues,
# sin conexión a Supabase (ni staging ni producción) y sin migraciones.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

env:
  CI: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  typecheck:
    name: npm run typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: npm run lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  build:
    name: npm run build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Sin variables VITE_*: el build no las necesita (se inyectan en Railway) y la CI no toca Supabase.
      - run: npm run build

  edge-security:
    name: edge-security (deno test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: supabase/functions
    env:
      # Clave de PRUEBA (fixture pública, no es un secreto): solo sirve para derivar la
      # clave AES del test. El test no se conecta a Supabase ni a ningún servicio externo.
      APP_ENCRYPTION_KEY: ci-test-key-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Permisos mínimos: solo lectura de la variable de entorno APP_ENCRYPTION_KEY.
      # --node-modules-dir=auto instala únicamente @types/node (lo exige el .d.ts de
      # supabase-js al comprobar tipos); no hay --allow-net ni --allow-all.
      - run: deno test --node-modules-dir=auto --allow-env=APP_ENCRYPTION_KEY _shared/integrations/security.test.ts _shared/solicitudes/descarga.test.ts _shared/i18n/i18n.test.ts _shared/intake/sendIntake.test.ts
